[project]
name = "tracewell"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "dpkt",      # lectura de pcap/pcapng y decodificación de capas
    "pyyaml",    # reglas
    "fastapi",   # API
    "uvicorn",   # servidor de la API
    "scapy",     # SOLO captura en vivo (backend/domain/pcap/live.py, import perezoso)
    "pywebview", # SOLO la ventana de escritorio (main.py, import perezoso)
    "psutil",    # OPCIONAL: columna "Proceso" en la captura en vivo (backend/domain/pcap/processes.py)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx2", "ruff"]  # httpx2: lo usa TestClient (Starlette); ruff: linter

[tool.pytest.ini_options]
# Los tests viven dentro de cada módulo; pythonpath "." permite `import backend...`.
testpaths = ["backend"]
pythonpath = ["."]

[tool.ruff]
# Solo pyflakes (F): imports sin usar, nombres sin definir, etc. No reformatea nada.
extend-exclude = ["frontend", "release"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# El fixture `mk` se importa de test_engine y cada test lo recibe por nombre (idioma de pytest)
"backend/domain/rules/tests/test_dns_ignore_suffixes.py" = ["F811"]
