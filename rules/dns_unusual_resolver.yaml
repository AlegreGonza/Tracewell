id: dns_unusual_resolver
name: DNS a un servidor no habitual
description: >
  Consultas DNS enviadas directo a un servidor público que no está en la lista de
  resolvedores conocidos. Un malware puede saltarse el DNS de la red para consultar el
  suyo. Los destinos privados (el router, el DNS de la empresa) se consideran normales.
  Si tu proveedor o tu empresa usa otro resolvedor, agregalo a allowed_resolvers.
severity: low
detector: dns_unusual_resolver
mitre:
  technique: T1071.004
  name: "Application Layer Protocol: DNS"
  tactic: Command and Control
params:
  allowed_resolvers:
    - 1.1.1.1
    - 1.0.0.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 149.112.112.112
    - 208.67.222.222
    - 208.67.220.220
